services:
  activemq:
    image: apache/activemq-artemis:latest
    container_name: activemq-artemis
    ports:
      - "8161:8161"
      - "5672:5672"
    environment:
      - ARTEMIS_USER=admin
      - ARTEMIS_PASSWORD=admin
      - AMQ_TRANSPORTS=amqp
    volumes:
      - artemis-data:/var/lib/artemis-instance
      - ./broker.xml:/var/lib/artemis-instance/etc/broker.xml

volumes:
  artemis-data: